name: Build Darkman AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Build APK
        working-directory: android-source
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        run: |
          ls -lh android-source/app/build/outputs/apk/release/
          test -n "$(find android-source/app/build/outputs/apk/release -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkmanAI-F-APK
          path: android-source/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
