plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.darkman"
    compileSdk 35
    defaultConfig {
        applicationId "com.darkman"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "2.0.0"
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
        externalNativeBuild { cmake { cppFlags "-std=c++17", "-fno-exceptions", "-fno-rtti"; arguments "-DANDROID_STL=c++_shared" } }
    }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro" }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = "1.8" }
    packaging { resources.excludes += ["META-INF/AL2.0", "META-INF/LGPL2.1"] }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
